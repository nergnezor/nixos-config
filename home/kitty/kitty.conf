# Explicit so kitty doesn't fall back to fontconfig's default monospace
# (Hack, no Nerd Font glyphs) -- matches Neovide's guifont in astrocore.lua.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Flygande pekare — Noctalia's themes/noctalia.conf only sets
# cursor_trail_color; without cursor_trail > 0 Kitty keeps the default (0 = off).
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

include themes/noctalia.conf
