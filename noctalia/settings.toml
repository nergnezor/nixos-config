[plugins]
enabled = [
    "noctalia/bongocat",
    "alexander/game-launcher",
    "lowcache/claude-companion",
    "yocraft/desktop-launcher",
    "tphilippot/git_companion",
    "avivbintangaringga/nix-monitor",
    "tordex/nvtop",
    "davemhammer/tailscale",
    "dunarand/tmux-provider"
]

[shell]
lang = "sv"
screen_time_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/erik/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.79999998211860657
    direction = "down_left"

[theme]
builtin = "Noctalia"
community_palette = "Shien"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "claude-code", "vscode", "lazygit" ]

[wallpaper]
fill_mode = "center"

    [wallpaper.default]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.last]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

[widget.cat]
audio_spectrum = true
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.launcher_2]
capsule = true
type = "alexander/game-launcher:launcher"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.pulse]
type = "lowcache/claude-companion:pulse"

[widget.spacer_2]
type = "spacer"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.widget]
type = "tphilippot/git_companion:widget"
