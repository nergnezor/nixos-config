[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "nrbu"

[plugin_settings."nzlov/daily-wallpaper"]
source = "nasa"

[plugins]
enabled = [
    "noctalia/bongocat",
    "alexander/game-launcher",
    "lowcache/claude-companion",
    "yocraft/desktop-launcher",
    "tphilippot/git_companion",
    "avivbintangaringga/nix-monitor",
    "tordex/nvtop",
    "davemhammer/tailscale",
    "dunarand/tmux-provider",
    "nzlov/daily-wallpaper"
]

[shell]
corner_radius_scale = 2.0
lang = "sv"
password_style = "random"
screen_time_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 20

    [shell.screenshot]
    directory = "/home/erik/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.78999998234212399
    direction = "down_left"

[theme]
builtin = "Catppuccin"
community_palette = "Tokyo Night Moon"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "claude-code", "spicetify", "neovim", "vscode", "steam", "lazygit", "tmux" ]

[wallpaper]
fill_mode = "center"

    [wallpaper.default]
    path = "/home/erik/Pictures/daily-wallpaper/nasa-2026-09-16.jpg"

    [wallpaper.last]
    path = "/home/erik/Pictures/daily-wallpaper/nasa-2026-09-16.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/erik/Pictures/daily-wallpaper/nasa-2026-09-16.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/erik/Pictures/daily-wallpaper/nasa-2026-09-16.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/erik/Pictures/hyperlink-dimension-al-7680x4320.jpg"

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.spacer_2]
type = "spacer"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.widget]
